# dsh-wiki-rag bundle patch 层
# 声明本 bundle 贡献的插件行：宿主工具插件（wiki-rag-host）
- insert:
    - id: wiki-rag-host
      name: 'dsh-wiki-rag'
      config:
        mdStoragePath: '.dsh-wiki-rag/md'
        zipStoragePath: '.dsh-wiki-rag/zip'
        chunkSize: 500
        chunkOverlap: 80
        webMode: 'external'
        webTimeout: 15000
        # ---- Embedding 配置 ----
        # provider: local（本地模型目录）/ openai（OpenAI 兼容 API）/ fallback（哈希降级，默认）
        embeddingProvider: 'fallback'
        # local 模式：填本地模型目录路径（ONNX 格式），如 /models/bge-small-zh-v1.5
        embeddingModelPath: ''
        # openai 模式：OpenAI 兼容 API 配置
        embeddingOpenAIBaseURL: 'https://api.openai.com/v1'
        embeddingOpenAIAPIKey: ''
        embeddingOpenAIModel: 'text-embedding-3-small'
        # ---- Rerank 配置 ----
        # provider: local（本地 cross-encoder）/ openai（OpenAI 兼容 rerank API）/ none（不重排，默认）
        rerankProvider: 'none'
        # local 模式：填本地 cross-encoder 模型目录路径
        rerankModelPath: ''
        # openai 模式：rerank API 配置
        rerankOpenAIBaseURL: 'https://api.openai.com/v1'
        rerankOpenAIAPIKey: ''
        rerankOpenAIModel: 'rerank-multilingual-v3'
        rerankTopK: 5
